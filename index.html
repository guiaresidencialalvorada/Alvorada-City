<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Guia Comercial | Bairro Alvorada</title>

<style>
/* ================= RESET ================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

/* ================= BODY ================= */
body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    line-height: 1.6;
}


body {
    overflow-x: hidden;
}



/* ================= HEADER ================= */
.header {
    position: absolute;
    top: 0;
    width: 100%;
    z-index: 10;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px;
}


.logo {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    color: #ffffff; /* BRANCO */
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}


/* MENU TOGGLE */
.menu-toggle {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #38bdf8;
}

/* MENU MOBILE */
.menu {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: rgba(2, 6, 23, 0.95);
    position: absolute;
    top: 60px;
    right: 12px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
}

.menu.open {
    display: flex;
}

.menu a {
    text-decoration: none;
    color: #e5e7eb;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    transition: all 0.25s ease;
}

.menu a:hover {
    background: #38bdf8;
    color: #020617;
}

/* ================= CONTAINER ================= */
.container {
    padding: 0 6px;
    max-width: 1300px;
    margin: auto;
}


h1#empresas {
    text-align: center;
    font-size: 26px;
    margin-bottom: 24px;
    font-weight: 800;
    color: #0f172a; /* PRETO */
    margin: 01px 0 5px;
    margin-top: 0px;
}


/* ================= GRID ================= */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    padding: 0;
}





/* ================= CARD ================= */
.card {
    background: #ffffff;
    border-radius: 14px;
    padding: 8px;

    display: flex;
    gap: 8px;

    width: 100%;
    min-width: 0;

    overflow: hidden;
}



.card:hover {
    transform: translateY(-4px) scale(1.01);
    border-color: #38bdf8;
    box-shadow: 0 0 18px rgba(56,189,248,0.35);
}
  .card {
    min-width: 0;
}
  
.card h3,
.card .categoria {
    white-space: normal;
    word-break: break-word;
    overflow-wrap: break-word;
}


.card h3 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}


.card .contatos {
    flex-wrap: wrap;
}

.card .btn {
    width: 100%;
}



    
/* ================= LOGO ================= */
.card .icone {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.card .icone img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* ================= INFO ================= */
.card .info {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.card h3 {
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;

    line-height: 1.2;

    margin: 0 0 2px 0;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
    text-overflow: ellipsis;

    word-break: break-word;
}



.card .categoria {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 4px;
}

/* ================= BOTÕES ================= */
.card .contatos {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
}


.card .btn {
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;

    padding: 5px 6px;
    font-size: 10.5px;

    width: 100%;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;

    white-space: nowrap;
    text-decoration: none;
}


.card {
    overflow: hidden;
}


/* TELEFONE */

.btn.telefone {
    font-size: 10.5px;
    justify-content: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}



/* WHATSAPP */
.btn.whatsapp {
    background: linear-gradient(135deg,#22c55e,#16a34a);
    color: #ecfdf5;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* WHATSAPP INATIVO */
.btn.whatsapp.inativo {
    background: #e5e7eb !important;
    color: #64748b !important;
    pointer-events: none;
    filter: grayscale(1);
    opacity: 0.7;
}

.btn.whatsapp.inativo::before {
    content: "⛔";
}



.btn.whatsapp:hover {
    filter: brightness(1.15);
}

/* ================= FOOTER ================= */
.footer {
    margin-top: 40px;
    padding: 20px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
}

/* MAPA */
.btn.mapa {
    background: linear-gradient(135deg,#38bdf8,#0284c7);
    color: #ffffff;
}

.btn.mapa:hover {
    filter: brightness(1.1);
}

.btn.maps {
    background: #e2e8f0;
    color: #020617;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}



/* ================= RESPONSIVO ================= */
/* TABLET */
@media (min-width: 700px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* DESKTOP */
@media (min-width: 1000px) {
    .grid {
        grid-template-columns: repeat(4, 1fr);
    }


    .menu {
        display: flex !important;
        flex-direction: row;
        position: static;
        background: transparent;
        border: none;
        padding: 0;
        gap: 16px;
    }

    .menu-toggle {
        display: none;
    }
}


   /* CELULAR */ 
@media (max-width: 400px) {
    .card {
        padding: 10px;
    }

    .card .icone {
        width: 54px;
        height: 54px;
        min-width: 54px;
    }

    .card h3 {
        font-size: 14px;
    }
}


    

    
/* ================= LOADING ================= */
.loading {
    text-align: center;
    font-weight: 700;
    color: #38bdf8;
    padding: 20px;
}

.hidden {
    display: none;
}
/* ================= STATUS LOJA ================= */

.status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 6px;
}

.status::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.aberto {
    color: #22c55e;
}

.aberto::before {
    background: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.6);
}

.fechado {
    color: #ef4444;
}

.fechado::before {
    background: #ef4444;
    box-shadow: 0 0 8px rgba(239,68,68,0.6);
}

/* ================= BUSCA ================= */
.search-box {
    max-width: 520px;
    margin: 0 auto 26px;
    position: relative;
}

.search-box .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #38bdf8;
}

.search-box input {
    width: 100%;
    padding: 14px 14px 14px 42px;
    border-radius: 14px;
    border: 1px solid rgba(56,189,248,0.35);
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: .25s;
}

.search-box input::placeholder {
    color: #64748b;
}

.search-box input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.25);
}
/* ================= HERO ALVORADA ================= */
.hero-alvorada {
    position: relative;
    width: 100%;
    height: 280px;
    overflow: hidden;
}

.hero-alvorada img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Gradiente elegante por cima */
.hero-alvorada::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;

    background: linear-gradient(
        to bottom,
        rgba(2,6,23,0.55),
        rgba(2,6,23,0.15),
        rgba(2,6,23,0.65)
    );
}


/* Label DIA / NOITE */
.hero-label {
    position: absolute;
    bottom: 16px;
    right: 18px;
    z-index: 2;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    backdrop-filter: blur(6px);
}


/* Responsivo */
@media (min-width: 900px) {
    .hero-alvorada {
        height: 420px;
    }
}

/* ================= DATA & HORA HERO ================= */

.hero-datetime {
    position: absolute;
    bottom: 72px;
    right: 18px;
    z-index: 3;

    color: #ffffff;
    font-size: 15px;
    padding: 0; /* remove caixa */

    font-weight: 700;
    letter-spacing: 0.6px;

    /* sombra no texto pra manter leitura */
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);

    /* REMOVE EMBASADO */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;

    background: transparent;

    border-radius: 0;

    text-align: right;
}


/* HERO TEXTO POSICIONAMENTO */

/* Mobile padrão */
.hero-overlay {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 3;
}

/* Desktop */
@media (min-width: 900px) {

    .hero-overlay {
        top: 140px; /* distância segura do menu */
    }

    .hero-overlay h1 {
        font-size: 42px;
    }

    .hero-overlay p {
        font-size: 18px;
    }

}




/* ================= NEWS TICKER ================= */
.news-ticker {
    width: 100%;
    background: #020617;
    border-top: 1px solid rgba(255,255,255,0.08);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
}

.ticker-wrap {
    width: 100%;
    overflow: hidden;
}

.ticker {
    display: inline-flex;
    align-items: center;
    gap: 60px;
    padding: 10px 0;
    white-space: nowrap;
    animation: tickerMove 50s linear infinite;
}

.ticker span {
    color: #e5e7eb;
    font-size: 14px;
    font-weight: 700;
}

/* Animação */
@keyframes tickerMove {
    from {
        transform: translateX(100%);
    }
    to {
        transform: translateX(-100%);
    }
}

/* Pausa ao passar o mouse */
.news-ticker:hover .ticker {
    animation-play-state: paused;
}

/* Mobile */
@media (max-width: 600px) {
    .ticker span {
        font-size: 13px;
    }
}

.endereco {
    font-size: 11px;
    color: #475569;
    margin-bottom: 4px;
    display: block;
}

.search-box {
    position: relative;
    max-width: 420px;
    margin: 0 auto 10px; /* 👈 espaço forte entre busca e cards */
}


.search-box input {
    width: 100%;
    padding: 12px 42px 12px 42px;
    border-radius: 30px;
    border: 1px solid #ddd;
    font-size: 15px;
    outline: none;
}

.search-box .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.6;
}

.clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: #eee;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.clear-btn:hover {
    background: #d9534f;
    color: #fff;
}

/* ================= MODAL NOTÍCIAS ================= */
.news-modal {
    position: fixed;
    inset: 0;
    background: rgba(2,6,23,0.75);
    backdrop-filter: blur(6px);
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;
}

.news-modal.hidden {
    display: none;
}

.news-modal-content {
    background: #ffffff;
    width: 92%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;

    border-radius: 20px;
    padding: 24px 22px 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);

    position: relative;
    animation: modalUp 0.35s ease;
}

.news-modal-content h2 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #0f172a;
    text-align: center;
}

.news-modal-content ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.news-modal-content li {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    color: #020617;
}

/* Botão fechar */
.close-modal {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: #e2e8f0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    font-weight: 800;
}

.close-modal:hover {
    background: #ef4444;
    color: #ffffff;
}

/* Animação */
@keyframes modalUp {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.ticker span {
    cursor: pointer;
}



/* Remove tamanho fixo */
.card-clima {
  width: auto;

}

.clima-info h1 {

<script>
/* MENU MOBILE */
const toggle = document.querySelector('.menu-toggle');
const menu = document.querySelector('.menu');

toggle.addEventListener('click', () => {
    menu.classList.toggle('open');
});

/* ANO AUTOMÁTICO */
document.getElementById('ano').innerText =
    `© ${new Date().getFullYear()} – Guia Comercial do Bairro Alvorada`;

let todasEmpresas = [];

/* ================= CARREGAR EMPRESAS ================= */

fetch('empresas.json')
    .then(response => {
        if (!response.ok) {
            throw new Error('Erro ao carregar empresas.json');
        }
        return response.json();
    })
    .then(dados => {
        todasEmpresas = dados;
        renderizarEmpresas(todasEmpresas);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('lista-empresas').classList.remove('hidden');
    })
    .catch(error => {
        console.error(error);
        document.getElementById('loading').innerHTML = `
            <p style="color:red; text-align:center; font-weight:bold;">
                ❌ Erro ao carregar empresas.json
            </p>`;
    });

    function ordenarPorStatus(empresas) {

        return empresas.sort((a, b) => {

            const statusA = verificarStatusPorDia(a.horarios).aberto;
            const statusB = verificarStatusPorDia(b.horarios).aberto;

            // 👉 abertas primeiro
            if (statusA && !statusB) return -1;
            if (!statusA && statusB) return 1;

            // 👉 se ambas abertas ou fechadas mantém ordem original
            return 0;
        });
    }




/* ================= RENDERIZAR ================= */

function renderizarEmpresas(empresas) {

    empresas = ordenarPorStatus(empresas);


    const grid = document.getElementById('lista-empresas');
    grid.innerHTML = '';

    if (empresas.length === 0) {
        grid.innerHTML = `
            <p style="grid-column:1/-1;text-align:center;color:#ef4444;font-weight:700;">
                Nenhuma empresa encontrada.
            </p>`;
        return;
    }

    empresas.forEach(empresa => {

        const foneLimpo = (empresa.fone || '').replace(/\D/g, '');
        let foneFormatado = foneLimpo;

        if (foneLimpo.length === 11) {
            foneFormatado = foneLimpo.replace(
                /(\d{2})(\d{5})(\d{4})/,
                '($1) $2-$3'
            );
        }

        grid.innerHTML += `
        <div class="card"
            data-horarios='${JSON.stringify(empresa.horarios)}'
            onclick="abrirSite('${empresa.site || ""}')">

            <div class="icone">
                <img src="${empresa.logo}" alt="${empresa.nome}"
                     loading="lazy"
                     onerror="this.src='assets/img/padrao.png'">
            </div>

            <div class="info">

                <h3>${empresa.nome}</h3>

                <small class="endereco">
                    ${empresa.endereco || ""}
                </small>

                <span class="categoria">${empresa.categoria}</span>

                <span class="status"></span>

                <div class="contatos">

                <a class="btn telefone" onclick="event.stopPropagation()" href="tel:${foneLimpo}">
                    📞 ${foneFormatado}
                </a>

                <a class="btn whatsapp" onclick="event.stopPropagation()"
                   href="https://wa.me/55${foneLimpo}" target="_blank">
                    🟢 WhatsApp
                </a>

                ${
                  empresa.maps 
                  ? `<a class="btn mapa" onclick="event.stopPropagation()" 
                        href="${empresa.maps}" target="_blank">
                        📍 Localização
                     </a>`
                  : ""
                }

            </div>

            </div>
        </div>`;
    });

    aplicarStatus();
}

setInterval(() => {
    renderizarEmpresas(todasEmpresas);
}, 60000);


/* ================= BUSCA ================= */

document.getElementById('busca').addEventListener('input', function () {

    const termo = this.value.toLowerCase().trim();

    const filtradas = todasEmpresas.filter(empresa =>
        empresa.nome.toLowerCase().includes(termo) ||
        empresa.categoria.toLowerCase().includes(termo)
    );

    renderizarEmpresas(filtradas);
});

/* ================= STATUS ================= */

function aplicarStatus() {

    document.querySelectorAll(".card").forEach(card => {

        const horarios = JSON.parse(card.dataset.horarios);
        const status = card.querySelector(".status");

        const resultado = verificarStatusPorDia(horarios);

        if (resultado.aberto) {

        status.textContent = `Aberto agora • Fecha às ${resultado.fecha}`;
        status.className = "status aberto";

        // ATIVA WHATSAPP
        const btnWhatsapp = card.querySelector(".btn.whatsapp");
        if (btnWhatsapp) {
            btnWhatsapp.classList.remove("inativo");
        }

        } else {

            status.textContent = "Fechado";
            status.className = "status fechado";

            // DESATIVA WHATSAPP
            const btnWhatsapp = card.querySelector(".btn.whatsapp");
            if (btnWhatsapp) {
                btnWhatsapp.classList.add("inativo");
            }

        }


    });
}

function verificarStatusPorDia(horarios) {

    const agora = new Date();
    const dias = ["dom","seg","ter","qua","qui","sex","sab"];

    const hojeIndex = agora.getDay();
    const hoje = dias[hojeIndex];
    const ontem = dias[(hojeIndex + 6) % 7];

    const agoraMin = agora.getHours() * 60 + agora.getMinutes();

    const hojeHorario = horarios[hoje];
    const ontemHorario = horarios[ontem];

    // 👉 VERIFICA SE CONTINUOU ABERTO DO DIA ANTERIOR
    if (ontemHorario && ontemHorario.diaSeguinte) {

        const [hA2, mA2] = ontemHorario.abre.split(":").map(Number);
        const [hF2, mF2] = ontemHorario.fecha.split(":").map(Number);

        const inicioOntem = hA2 * 60 + mA2;
        const fimHoje = hF2 * 60 + mF2;

        if (agoraMin < fimHoje) {
            return {
                aberto: true,
                fecha: ontemHorario.fecha
            };
        }
    }

    // 👉 VERIFICA HORÁRIO NORMAL DE HOJE
    if (!hojeHorario || hojeHorario.fechado) {
        return { aberto: false };
    }

    const [hA, mA] = hojeHorario.abre.split(":").map(Number);
    const [hF, mF] = hojeHorario.fecha.split(":").map(Number);

    const inicio = hA * 60 + mA;
    const fim = hF * 60 + mF;

    // Caso vire o dia
    if (hojeHorario.diaSeguinte) {

        if (agoraMin >= inicio) {
            return {
                aberto: true,
                fecha: hojeHorario.fecha
            };
        }

    } else {

        if (agoraMin >= inicio && agoraMin < fim) {
            return {
                aberto: true,
                fecha: hojeHorario.fecha
            };
        }

    }

    return { aberto: false };
}


/* ================= SITE ================= */

function abrirSite(url) {
    if (!url) return;
    window.open(url, "_blank");
}

<script>

  function atualizarImagemHero(climaID) {

    const hora = new Date().getHours();
    const isDia = hora >= 6 && hora < 18;

    let imagem = "alvorada-dia.png"; // padrão

    // 🌧️ Chuva
    if (climaID >= 200 && climaID < 600) {
      imagem = isDia
        ? "alvorada-chuva-dia.png"
        : "alvorada-chuva-noite.png";
    }

    // 🌫️ Neblina
    else if (climaID >= 700 && climaID < 800) {
      imagem = isDia
        ? "alvorada-neblina-dia.png"
        : "alvorada-neblina-noite.png";
    }

    // ☁️ Nublado à noite
    else if (climaID > 800 && !isDia) {
      imagem = "alvorada-nublado-noite.png";
    }

    // ☀️ Céu limpo
    else {
      imagem = isDia
        ? "alvorada-dia.png"
        : "alvorada-noite.png";
    }

    if (heroImg) {
      heroImg.src = `assets/img/${imagem}`;
    }

    console.log("IMAGEM HERO:", imagem);
  }

  async function buscarClima() {

    try {

      const res = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?lat=${CONFIG.lat}&lon=${CONFIG.lon}&units=metric&lang=pt_br&appid=${CONFIG.apiKey}`,
        { cache: "no-store" }
      );

      const data = await res.json();

      console.log("CLIMA ATUAL:", data);

      elCidade.textContent = CONFIG.cidade;
      elTemp.textContent = Math.round(data.main.temp) + "°C";
      elDesc.textContent = data.weather[0].description;

      const id = data.weather[0].id;
      elAnim.innerHTML = "";

      if (id >= 200 && id < 300) elAnim.textContent = "⛈️";
      else if (id >= 300 && id < 600) elAnim.textContent = "🌧️";
      else if (id >= 700 && id < 800) elAnim.textContent = "🌫️";
      else if (id === 800) elAnim.innerHTML = elSol.outerHTML;
      else elAnim.textContent = "☁️";

      if (data.rain && data.rain["1h"]) {
        elDesc.textContent += " • ☔ " + data.rain["1h"] + " mm";
      }

      // 🔥 ATUALIZA IMAGEM DO HERO
      atualizarImagemHero(id);

    } catch (err) {

      console.error("Erro clima:", err);

      elCidade.textContent = CONFIG.cidade;
      elTemp.textContent = "--°C";
      elDesc.textContent = "Erro ao carregar clima";
      elAnim.textContent = "⚠️";

    }

  }

  buscarClima();
  setInterval(buscarClima, 600000); // 10 minutos

})();
</script>




<script>
(() => {

  const minUsers = 10;   // mínimo online
  const maxUsers = 38;   // máximo online

  const el = document.getElementById("onlineUsers");

  let online = Math.floor(
    Math.random() * (maxUsers - minUsers + 1)
  ) + minUsers;

  el.textContent = online;

  function atualizarOnline() {

    const variacao = Math.floor(Math.random() * 5) - 2;
    online += variacao;

    if (online < minUsers) online = minUsers;
    if (online > maxUsers) online = maxUsers;

    el.textContent = online;
  }

  // Atualiza a cada 7 até 14 segundos
  setInterval(atualizarOnline, 
    Math.floor(Math.random() * 7000) + 7000
  );

})();
</script>
