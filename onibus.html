<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ônibus | Bairro Alvorada</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Roboto,sans-serif}

/* BODY */
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:#fff;
padding-bottom:40px;
}

/* HEADER */
header{
padding:18px;
text-align:center;
font-weight:800;
font-size:20px;
background:rgba(0,0,0,0.3);
backdrop-filter:blur(10px);
}

.sub{
font-size:13px;
opacity:.7;
margin-top:4px;
}

/* CONTAINER */
.container{
padding:18px;
max-width:900px;
margin:auto;
}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
border-radius:20px;
padding:20px;
margin-bottom:20px;
backdrop-filter:blur(12px);
box-shadow:0 8px 25px rgba(0,0,0,0.4);
}

/* TITULO */
.card h2{
font-size:16px;
margin-bottom:14px;
color:#38bdf8;
}

/* GRID HORÁRIOS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
gap:8px;
}

.grid div{
background:rgba(255,255,255,0.12);
padding:8px;
border-radius:10px;
text-align:center;
font-weight:700;
font-size:13px;
}

/* PROXIMO ONIBUS */
.proximo{
background:#38bdf8;
color:#0f172a;
padding:15px;
border-radius:16px;
text-align:center;
font-weight:800;
font-size:16px;
margin-bottom:20px;
box-shadow:0 6px 20px rgba(56,189,248,0.5);
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<header>
Residencial Alvorada
<div class="sub">Linha 4702 • América do Sul ⇄ Gama</div>
</header>

<div class="container">

<div class="proximo" id="proximoOnibus">
Calculando próximo ônibus...
</div>

<div class="card">
<h2>Alvorada ➝ Gama</h2>
<div class="grid" id="ida"></div>
</div>

<div class="card">
<h2>Gama ➝ Alvorada</h2>
<div class="grid" id="volta"></div>
</div>

<div class="footer">
Horários sujeitos a alteração sem aviso prévio.
</div>

</div>

<script>

// HORÁRIOS
const horarios = {
util:{
ida:["05:00","06:30","08:10","10:10","12:00","13:50","16:00","18:00","19:30"],
volta:["06:00","07:30","09:30","11:20","13:10","15:25","17:00","18:45","20:10"]
},
sabado:{
ida:["05:20","06:50","08:10","10:10","12:00","13:50","16:00","18:00","19:30"],
volta:["06:10","07:30","09:30","11:20","13:10","15:25","17:00","18:45","20:10"]
},
domingo:{
ida:["05:20","06:50","08:10","12:00","13:50","18:00","19:20","21:00"],
volta:["06:10","07:30","11:20","13:10","17:20","18:40","20:10"]
}
};

// IDENTIFICAR DIA
const hoje = new Date().getDay();
let tipo;

if(hoje>=1 && hoje<=5) tipo="util";
else if(hoje==6) tipo="sabado";
else tipo="domingo";

// MOSTRAR HORÁRIOS
const idaDiv = document.getElementById("ida");
const voltaDiv = document.getElementById("volta");

horarios[tipo].ida.forEach(h=>{
idaDiv.innerHTML += `<div>${h}</div>`;
});

horarios[tipo].volta.forEach(h=>{
voltaDiv.innerHTML += `<div>${h}</div>`;
});

// CALCULAR PRÓXIMO ÔNIBUS (IDA)
function atualizarProximo(){

const agora = new Date();
const minutosAgora = agora.getHours()*60 + agora.getMinutes();

let proximo = null;

horarios[tipo].ida.forEach(h=>{
const [hora,min] = h.split(":");
const total = parseInt(hora)*60 + parseInt(min);

if(total >= minutosAgora && proximo === null){
proximo = total;
}
});

const box = document.getElementById("proximoOnibus");

if(proximo){
const diff = proximo - minutosAgora;
const horas = Math.floor(diff/60);
const minutos = diff%60;

box.innerHTML = `⏳ Próximo ônibus (Alvorada ➝ Gama) em ${horas>0?horas+"h ":""}${minutos}min`;
}else{
box.innerHTML = "🚫 Não há mais ônibus hoje.";
}

}

atualizarProximo();
setInterval(atualizarProximo,60000);

</script>

</body>
</html>
